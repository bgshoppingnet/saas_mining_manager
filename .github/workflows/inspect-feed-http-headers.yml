name: Inspect BGShopping feed download headers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-feed-http-headers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect browser download headers without fetching 20MB feeds
        shell: bash
        run: |
          set -euo pipefail
          for url in             https://bgshopping.net/pazaruvaj.xml             https://bgshopping.net/shopmania.xml             https://bgshopping.net/google-shopping.xml             https://bgshopping.net/ai-products.json             https://raw.githubusercontent.com/bgshoppingnet/saas_mining_manager/feed-cdn/feeds/pazaruvaj.xml             https://bgshoppingnet.github.io/saas_mining_manager/feeds/pazaruvaj.xml; do
            echo "BEGIN $url"
            curl -sSLI --connect-timeout 10 --max-time 30 "$url" | grep -Ei '^HTTP/|^content-type:|^content-disposition:|^content-length:|^location:|^x-content-type-options:' || true
            echo "END $url"
          done
