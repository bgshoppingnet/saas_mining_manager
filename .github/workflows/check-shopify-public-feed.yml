name: Check Shopify public product feed source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-shopify-public-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public product data without Render or credentials
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://bgshopping.net/products.json?limit=3&page=1' 'https://bgshopping.net/collections/all/products.json?limit=3&page=1'; do
            echo "Probing Shopify public JSON"
            code=$(curl -LsS --retry 2 --max-time 35 --connect-timeout 12 -H 'Accept: application/json' -o source.json -w '%{http_code}' "$url" || true)
            echo "HTTP status: $code"
            if [ "$code" = 200 ]; then
              python -c 'import json; d=json.load(open("source.json", encoding="utf-8")); a=d.get("products", []) if isinstance(d,dict) else []; print("VALID_SOURCE:",len(a),"has_variant:",bool(a and a[0].get("variants")),"price:",str(a[0]["variants"][0].get("price"))[:10] if a and a[0].get("variants") else "none")'
            fi
          done
