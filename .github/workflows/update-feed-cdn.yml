# Manual refresh trigger 2026-10-09: brand/model enrichment pipeline
name: Update Feed CDN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-feed-cdn.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feed-cdn branch
        uses: actions/checkout@v4
        with:
          ref: feed-cdn

      - name: Fetch latest feeds from generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p feeds tmp-feeds

          fetch_with_retry() {
            url="$1"
            out="$2"
            for i in $(seq 1 90); do
              code=$(curl -L -sS -o "$out.tmp" -w '%{http_code}' --max-time 120 "$url" || true)
              if [ "$code" = "200" ] && [ -s "$out.tmp" ]; then
                mv "$out.tmp" "$out"
                return 0
              fi
              rm -f "$out.tmp"
              echo "Attempt $i for $url returned HTTP $code; retrying in 10s"
              sleep 10
            done
            echo "Failed to fetch $url after retries" >&2
            return 1
          }

          fetch_with_retry "https://bgshopping-pazaruvaj-feed.onrender.com/pazaruvaj.xml" "tmp-feeds/pazaruvaj.xml"
          fetch_with_retry "https://bgshopping-pazaruvaj-feed.onrender.com/google-shopping.xml" "tmp-feeds/google-shopping.xml"
          fetch_with_retry "https://bgshopping-pazaruvaj-feed.onrender.com/ai-products.json" "tmp-feeds/ai-products.json"

      - name: Validate downloaded feeds
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '<products\|<rss\|<channel' tmp-feeds/pazaruvaj.xml
          grep -qi '<rss\|<channel\|<item' tmp-feeds/google-shopping.xml
          python - <<'PY'
          import json
          with open('tmp-feeds/ai-products.json', 'r', encoding='utf-8') as f:
              data=json.load(f)
          if not isinstance(data, (list, dict)):
              raise SystemExit('Unexpected AI feed JSON shape')
          PY

      - name: Improve Google Shopping feed for Bulgaria
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape, unescape

          path = Path('tmp-feeds/google-shopping.xml')
          text = path.read_text(encoding='utf-8')

          # Shopify domestic shipping profile:
          # 8.99 BGN standard shipping, free from 70.00 BGN, 3-5 business days.
          # Official fixed conversion: 1 EUR = 1.95583 BGN.
          flat_eur = 4.60
          free_threshold_eur = 35.79

          item_re = re.compile(r'<item>(.*?)</item>', re.S)
          price_re = re.compile(r'<g:price>\s*([0-9]+(?:\.[0-9]+)?)\s+EUR\s*</g:price>', re.I)
          title_re = re.compile(r'<title>(.*?)</title>', re.S | re.I)
          brand_re = re.compile(r'<g:brand>(.*?)</g:brand>', re.S | re.I)
          category_re = re.compile(r'<g:product_type>(.*?)</g:product_type>', re.S | re.I)
          description_re = re.compile(r'<description>.*?</description>', re.S | re.I)
          gtin_re = re.compile(r'<g:gtin>.*?</g:gtin>', re.S | re.I)
          mpn_re = re.compile(r'<g:mpn>.*?</g:mpn>', re.S | re.I)
          identifier_exists_re = re.compile(r'<g:identifier_exists>.*?</g:identifier_exists>', re.S | re.I)
          existing_shipping_re = re.compile(r'<g:shipping>.*?</g:shipping>', re.S | re.I)

          counters = {
              'items': 0,
              'shipping': 0,
              'description_fallback': 0,
              'identifier_false': 0,
          }

          def value(rx, body):
              m = rx.search(body)
              return unescape(m.group(1).strip()) if m else ''

          def patch_item(match):
              body = match.group(1)
              counters['items'] += 1

              # Keep one deterministic BG product-level shipping block.
              body = existing_shipping_re.sub('', body)
              pm = price_re.search(body)
              if pm:
                  product_price = float(pm.group(1))
                  shipping_price = 0.00 if product_price >= free_threshold_eur else flat_eur
                  shipping = (
                      '\n<g:shipping>'
                      '<g:country>BG</g:country>'
                      '<g:service>Standard</g:service>'
                      f'<g:price>{shipping_price:.2f} EUR</g:price>'
                      '<g:min_handling_time>0</g:min_handling_time>'
                      '<g:max_handling_time>0</g:max_handling_time>'
                      '<g:min_transit_time>3</g:min_transit_time>'
                      '<g:max_transit_time>5</g:max_transit_time>'
                      '</g:shipping>\n'
                  )
                  body += shipping
                  counters['shipping'] += 1

              if not description_re.search(body):
                  title = value(title_re, body)
                  brand = value(brand_re, body)
                  category = value(category_re, body)
                  parts = [p for p in [title, brand, category] if p]
                  if parts:
                      fallback = ' · '.join(dict.fromkeys(parts))
                      body += f'\n<description>{escape(fallback)}</description>\n'
                      counters['description_fallback'] += 1

              has_gtin = bool(gtin_re.search(body))
              has_mpn = bool(mpn_re.search(body))
              body = identifier_exists_re.sub('', body)
              if not has_gtin and not has_mpn:
                  body += '\n<g:identifier_exists>false</g:identifier_exists>\n'
                  counters['identifier_false'] += 1

              return '<item>' + body + '</item>'

          patched, count = item_re.subn(patch_item, text)
          if count < 1:
              raise SystemExit('No Google Shopping items found to patch')
          path.write_text(patched, encoding='utf-8')
          print(counters)
          PY

          grep -q '<g:country>BG</g:country>' tmp-feeds/google-shopping.xml
          grep -q '<g:service>Standard</g:service>' tmp-feeds/google-shopping.xml

      - name: Publish atomically to branch
        shell: bash
        run: |
          set -euo pipefail
          mv tmp-feeds/pazaruvaj.xml feeds/pazaruvaj.xml
          mv tmp-feeds/google-shopping.xml feeds/google-shopping.xml
          mv tmp-feeds/ai-products.json feeds/ai-products.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > feeds/last-updated.txt
          git config user.name 'BGShopping Feed Bot'
          git config user.email 'bgshopping.net@gmail.com'
          git add feeds
          if git diff --cached --quiet; then
            echo 'No feed changes to publish.'
            exit 0
          fi
          git commit -m 'Refresh stable product feeds'
          git push origin HEAD:feed-cdn
