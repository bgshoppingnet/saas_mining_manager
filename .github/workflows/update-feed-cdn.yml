name: Update Feed CDN Direct Shopify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-feed-cdn.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgshopping-public-feeds
  cancel-in-progress: false

jobs:
  refresh-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the public feed storage branch
        uses: actions/checkout@v4
        with:
          ref: feed-cdn
          fetch-depth: 0

      - name: Validate generator code
        run: |
          python -m py_compile scripts/snapshot_public_shopify.py scripts/rebuild_channel_feeds.py scripts/build_meta_catalog.py

      - name: Fetch current products directly from Shopify
        run: |
          python scripts/snapshot_public_shopify.py

      - name: Rebuild Pazaruvaj, Google, ShopMania and AI product feeds
        run: |
          python scripts/rebuild_channel_feeds.py
          python scripts/build_meta_catalog.py

      - name: Verify current date, valid formats and realistic totals
        shell: bash
        run: |
          python -c 'import json,datetime,pathlib,xml.etree.ElementTree as E; p=pathlib.Path("feeds"); s=json.loads((p/"feed-status.json").read_text()); t=datetime.datetime.fromisoformat(s["source_generated_at"].replace("Z","+00:00")); assert (datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()<1800, "Stale source"; assert s["source_rows"]>=8000 and s["pazaruvaj_products"]>=8000, s; assert s["google_products"]>=8000 and s["shopmania_products"]>=8000, s; [E.parse(p/f) for f in ("pazaruvaj.xml","google-shopping.xml","shopmania.xml","meta-catalog.xml")]; assert len(json.loads((p/"ai-products.json").read_text())["products"])>=8000; print("ALL FIVE FEEDS VALID",s)'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > feeds/last-updated.txt

      - name: Report Shopify Files size eligibility
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("feeds"); names=["pazaruvaj.xml","shopmania.xml","google-shopping.xml","meta-catalog.xml","ai-products.json","feed-status.json"]; print("SHOPIFY_CDN_SIZE_CHECK",[(n,(p/n).stat().st_size,(p/n).stat().st_size<19000000) for n in names],flush=True)'

      - name: Publish only fully validated feeds to GitHub (no Render)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BGShopping Feed Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve the fully validated output, then rebase on current remote
          # without overwriting unrelated scripts changed by another workflow.
          mkdir -p /tmp/bgshopping-publish
          cp -a feeds /tmp/bgshopping-publish/
          for attempt in 1 2 3; do
            git fetch origin feed-cdn
            git reset --hard origin/feed-cdn
            cp -a /tmp/bgshopping-publish/feeds/. feeds/
            git add feeds
            if git diff --cached --quiet; then
              echo 'Verified feeds already current'
              exit 0
            fi
            git commit -m 'Refresh current Shopify XML and JSON product feeds without Render'
            if git push origin HEAD:feed-cdn; then
              echo 'Published validated Shopify feeds'
              exit 0
            fi
            echo "Concurrent feed update detected, retrying ($attempt)"
          done
          echo 'Feed publish failed after safe retries'
          exit 1
