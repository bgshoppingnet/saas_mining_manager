name: Patch Feed Brand Canonicalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-feed-brand-canonicalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add canonical brand guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          marker="def mf(p,k): return str(((p.get(k) or {}).get('value')) or '').strip()\n"
          helper="def canonical_brand(v):\n    raw=' '.join(str(v or '').split()).strip(); low=raw.casefold()\n    if not raw:return ''\n    if low.startswith('raider'):return 'Raider'\n    if low.startswith('lorelli') or low.startswith('loreli'):return 'Lorelli'\n    if low in ('kikaboo','kikka boo','kikka-boo'):return 'KikkaBoo'\n    if low.startswith('metabo'):return 'Metabo'\n    return raw\n"
          if 'def canonical_brand(v):' not in s:
              if marker not in s:
                  raise SystemExit('mf marker not found')
              s=s.replace(marker,marker+helper,1)
          old="'brand':mf(p,'brand') or (p.get('vendor') or '').strip()"
          new="'brand':canonical_brand(mf(p,'brand') or (p.get('vendor') or '').strip())"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('brand expression not found')
          s=s.replace("'User-Agent':'BGShopping-Commerce-Feeds/9.0'","'User-Agent':'BGShopping-Commerce-Feeds/9.1'")
          s=s.replace("version='9.0'","version='9.1'")
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app.py
          grep -q "def canonical_brand" app.py
          grep -q "canonical_brand(mf(p,'brand')" app.py
      - name: Commit generator patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BGShopping Automation'
          git config user.email 'bgshopping.net@gmail.com'
          git add app.py
          if git diff --cached --quiet; then
            echo 'Canonical brand guard already present.'
            exit 0
          fi
          git commit -m 'Canonicalize brand in all generated product feeds'
          git push origin HEAD:main
