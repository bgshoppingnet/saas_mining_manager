name: Verify Live BGShopping Shopify CDN Feeds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-feed-links.yml'
  schedule:
    - cron: '53 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify seven branded Shopify feed URLs and inline MIME
        shell: bash
        run: |
          set -euo pipefail
          for path in pazaruvaj.xml pazarovaj.xml shopmania.xml google-shopping.xml meta-catalog.xml ai-products.json feed-status.json; do
            expected="application/xml"
            case "$path" in *.json) expected="application/json";; esac
            good=0
            for attempt in 1 2 3; do
              headers=$(mktemp)
              result=$(curl -sSLI --retry 1 --max-time 45 --connect-timeout 12 -o "$headers" -w '%{http_code} %{url_effective}' "https://bgshopping.net/$path" || true)
              echo "$path => $result"
              if [ "${result%% *}" = "200" ] && [[ "${result#* }" == https://cdn.shopify.com/* ]] && grep -qi "^content-type: $expected" "$headers" && ! grep -qi '^content-disposition: attachment' "$headers"; then
                good=1
              fi
              rm -f "$headers"
              if [ "$good" = 1 ]; then break; fi
              sleep 5
            done
            if [ "$good" != 1 ]; then
              echo "FAILED $path: expected real Shopify CDN with inline $expected"
              exit 1
            fi
          done
      - name: Verify Shopify feed status is valid and current
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 12 --max-time 40 https://bgshopping.net/feed-status.json -o /tmp/shopify-feed-status.json
          python - <<'PY'
          import datetime, json
          from pathlib import Path
          d=json.loads(Path("/tmp/shopify-feed-status.json").read_text())
          assert d.get("currency")=="EUR"
          assert min(d.get("pazaruvaj_products",0),d.get("google_products",0),d.get("ai_products",0),d.get("shopmania_products",0))>=8000
          stamp=datetime.datetime.fromisoformat(d["source_generated_at"].replace("Z","+00:00"))
          age=(datetime.datetime.now(datetime.timezone.utc)-stamp).total_seconds()
          print("Shopify CDN feed age (hours):",round(age/3600,2),"product rows:",d.get("source_rows"))
          assert 0<=age<=6*3600, "Shopify CDN feed is stale (>6 hours); check SHOPIFY_CLIENT_ID/SHOPIFY_CLIENT_SECRET GitHub Actions secrets"
          PY
